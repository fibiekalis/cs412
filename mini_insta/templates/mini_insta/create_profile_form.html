      HTML file for mini_insta to create a Profile -->

      {% extends 'mini_insta/base.html' %}

      {% block content %}

      <h1>Create a Mini Insta Profile!</h1>
      
      <form method="POST">
          {% csrf_token %}
      
          <p>
              <h3>Account Information</h3>
              {{ user_form }}
          </p>
      
          <p>
              <h3>Profile Information</h3>
              {{ form }}
          </p>
      
          <input type="submit" value="Create Profile">
      </form>
      
      {% endblock %}
