<!--mini_insta/create_post_form.html
    display the HTML form to create a new Post on a Profile object-->

{% extends 'mini_insta/base.html' %}

{% block content %}
<h1>Create a new post for @{{profile.username}}</h1>

<form action="{% url 'create_post' profile.pk %}" method="POST">
    {% csrf_token %}

    <table>
        {{ form.as_table }}
        <tr>        <!--Table Row-->
            <th><label for="image_url">Image URL:</label></th>   <!--Table Header-->
            <td><input type="url" name="image_url" id="image_url"></td>     <!--Table data-->
        </tr>
    </table>

    <input type="submit" name="submit" value="Submit">
    <a href="{% url 'show_profile' profile.pk %}">Cancel</a>

</form>
{% endblock %}
