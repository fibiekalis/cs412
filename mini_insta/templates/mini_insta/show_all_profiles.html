{% extends 'mini_insta/base.html' %}

{% block content %}

<h2>All Instagram Profiles</h2>

<main class="grid-container">

    <!--For loop to iterate through all profiles-->
    <!--For each profile, display the name, username, and image-->
    {% for profile in profiles %}
    <article>
        <div>
            <h3>{{ profile.display_name }}</h3>
            <strong>@{{ profile.username }}</strong>
        </div>

        {% if profile.profile_image_url %}
            <a href="{% url 'show_profile' profile.pk %}">
                <img src="{{ profile.profile_image_url }}" alt="@{{ profile.username }}'s profile picture">
            </a>
        {% endif %}

        <div>
            <h2>
                <a href="{% url 'show_profile' profile.pk %}"></a>
                {{ profile.display_name }}
            </h2>

            <p>@{{ profile.username }}</p>
        </div>

    </article>
    {% endfor %}

</main> 
{% endblock %}
