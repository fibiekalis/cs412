{% load static %}
<html>
    <head>
        <title>Mini Instagram</title>
        <link rel="stylesheet" href="{% static 'A3.css'%}">
    </head>
    <body>
        <header>
            <h1>Mini Instagram!</h1>

            <nav>
                <ul>
                    <li><a href="{% url 'show_all_profiles' %}">Profiles</a></li>
                    {% if profile %}        <!--Only show create post navigation when profile is in the context data-->
                        <li><a href="{% url 'show_feed' profile.pk %}">Home</a></li>
                        <li><a href="{% url 'show_profile' profile.pk %}">My Profile</a></li>
                        <li><a href="{% url 'create_post' profile.pk %}"></a>Create Post</li>
                        <li><a href="{% url 'search' profile.pk %}">Search</a></li>
                    {% endif %}
                </ul>
            </nav>
        </header>

    {% block content%}
    {% endblock %}

        <footer>
            <p>Mini Instagram</p>
            <a href="{% url 'show_all_profiles' %}">View All Profiles</a>
        </footer>

    </body>
</html>
