      {% extends 'mini_insta/base.html' %}

      {% block content %}

      <h2>Mini Instagram Search</h2>

      <form method="GET" action="{% url 'search' %}">
        <label for="query">Search Profiles and Posts:</label>
        <textarea name="query" id="query" rows="2"></textarea>
        <input type="submit" value="Search"> 
      </form>

      {% endblock %}
