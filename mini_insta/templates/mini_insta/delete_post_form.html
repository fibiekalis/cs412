 <!-- File: delete_post_form.html 
      Author: Fibie Kalis (fibie@bu.edu) 10/17/2026 
      HTML file that displays the post that will be deleted -->

      {% extends 'mini_insta/base.html' %}

      {% block content %}
      <h3>Are you sure you want to delete this post?</h3>
      <p>
        {{ post }}
      </p>

      <!-- first form to delete -->
       <form method="POST">
            {% csrf_token %}
            <input type="submit" value="Delete">
       </form>

       <!-- second form to cancel and return to profile -->
        <form action="{% url 'show_profile' profile.pk %}" method="GET">
            <input type="submit" value="Cancel">
        </form>
    
        {% endblock %}
