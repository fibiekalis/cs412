{% block content %}

<h2>Picture {{picture.pk }}</h2>

<img src="{{ picture.image_url }}" alt="Silly Picture" width="400">

<p>By: {{ picture.name }}</p>
<p>{{ picture.timestamp }}</p>

{% endblock %}
